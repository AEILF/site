# Configuration de la page d'administration (Pages CMS : https://app.pagescms.org)
# Chaque bloc ci-dessous devient un formulaire dans l'admin.

media:
  input: images
  output: images

content:
  - name: site
    label: Textes du site
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: nom, label: Nom complet de l'association, type: string }
      - { name: sigle, label: Sigle géant de la page d'accueil (ex. AEILF), type: string }
      - { name: nomLigne1, label: Nom dans l'en-tête - ligne 1, type: string }
      - { name: nomLigne2, label: Nom dans l'en-tête - ligne 2, type: string }
      - { name: lieu, label: Petite ligne au-dessus du titre, type: string }
      - { name: titreLigne1, label: Grand titre - ligne 1, type: string }
      - { name: titreLigne2, label: Grand titre - ligne 2, type: string }
      - { name: motsAccent, label: "Grand titre - mot en Times (un seul mot ; s'il y en a plusieurs, ils défilent)", type: string, list: true }
      - { name: accroche, label: Phrase d'accroche, type: text }
      - { name: illustrationAlt, label: Description de l'illustration (pour les malvoyants), type: string }
      - { name: illustrationCredit, label: Crédit de l'illustration, type: string }
      - { name: manifeste, label: Art. 1 - Texte de présentation, type: text }
      - { name: institut, label: Art. 1 - Paragraphe sur l'institut, type: text }
      - { name: motsCles, label: Mots du bandeau défilant, type: string, list: true }
      - { name: adhesionTitre, label: "Art. 6 - Titre (un seul mot *entre astérisques* = Times italique)", type: string }
      - { name: adhesionTexte, label: Art. 6 - Texte, type: text }
      - { name: adhesionPrix, label: Art. 6 - Montant de la cotisation, type: string }
      - { name: adhesionLien, label: Lien vers la page d'adhésion HelloAsso, type: string }
      - { name: email, label: Adresse e-mail de contact, type: string }
      - { name: instagram, label: Lien Instagram (facultatif), type: string }
      - { name: linkedin, label: Lien LinkedIn (facultatif), type: string }
      - name: mentions
        label: Mentions légales
        type: object
        fields:
          - { name: siege, label: Adresse du siège social, type: string }
          - { name: rna, label: Numéro RNA, type: string }
          - { name: directeurPublication, label: Directeur ou directrice de la publication, type: string }
          - { name: hebergeur, label: Hébergeur, type: string }

  - name: evenements
    label: Événements
    type: file
    path: content/evenements.json
    format: json
    fields:
      - name: evenements
        label: Événements
        type: object
        list: { collapsible: { collapsed: true, summary: "{date} · {titre}" } }
        fields:
          - { name: titre, label: Titre, type: string, required: true }
          - { name: date, label: Date, type: date, required: true }
          - { name: heure, label: Heure (ex. 18:30), type: string }
          - { name: lieu, label: Lieu, type: string }
          - name: categorie
            label: Catégorie
            type: select
            options:
              values: [Conférence, Concours, Atelier, Soirée, Rencontre professionnelle, Vie associative, Autre]
          - { name: description, label: Description courte, type: text }
          - { name: lien, label: Lien d'inscription ou billetterie (facultatif), type: string }
          - { name: exemple, label: Afficher l'étiquette « Exemple », type: boolean }

  - name: activites
    label: Activités
    type: file
    path: content/activites.json
    format: json
    fields:
      - name: activites
        label: Activités
        type: object
        list: { collapsible: { collapsed: true, summary: "{titre}" } }
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }

  - name: bureau
    label: Bureau
    type: file
    path: content/bureau.json
    format: json
    fields:
      - name: groupes
        label: Photos de groupe (bureau étendu, bureau restreint…)
        type: object
        list: { collapsible: { collapsed: true, summary: "{intitule} {annee}" } }
        fields:
          - { name: intitule, label: "Intitulé (ex. Bureau étendu)", type: string, required: true }
          - { name: annee, label: "Année (ex. 2026-2027)", type: string }
          - { name: photo, label: Photo de groupe, type: image }
          - { name: alt, label: Description de la photo (pour les malvoyants), type: string }
          - name: personnes
            label: "Personnes : premier rang de gauche à droite, puis second rang (la fiche n° X correspond au repère X sur la photo)"
            type: object
            list: { collapsible: { collapsed: true, summary: "Repère {index} · {nom} — {role}" } }
            fields:
              - { name: nom, label: Prénom et nom, type: string }
              - { name: role, label: Fonction, type: string }
              - { name: rang, label: "Rang (1 = premier rang, 2 = second rang)", type: number }
              - { name: x, label: "Position horizontale du visage, en % de la largeur (0 = bord gauche)", type: number }
              - { name: y, label: "Position verticale du visage, en % de la hauteur (0 = haut)", type: number }
      - name: membres
        label: Membres du bureau
        type: object
        list: { collapsible: { collapsed: true, summary: "{nom} — {role}" } }
        fields:
          - { name: nom, label: Prénom et nom, type: string }
          - { name: role, label: Fonction, type: string }
          - { name: promo, label: Promotion, type: string }
          - { name: photo, label: Photo (facultative), type: image }

  - name: poles
    label: Pôles
    type: file
    path: content/poles.json
    format: json
    fields:
      - name: poles
        label: Pôles
        type: object
        list: { collapsible: { collapsed: true, summary: "{nom}" } }
        fields:
          - { name: nom, label: Nom du pôle, type: string, required: true }
          - { name: accroche, label: Phrase courte, type: string }
          - { name: description, label: Présentation, type: text }
          - { name: photo, label: Photo des membres du pôle (facultative), type: image }
          - { name: responsables, label: Responsable(s), type: string }
          - { name: membres, label: Membres, type: string, list: true }
          - { name: email, label: Adresse e-mail du pôle, type: string }
          - { name: instagram, label: Lien Instagram du pôle (facultatif), type: string }
          - { name: lien, label: "Lien vers une page (facultatif, ex. recherche.html)", type: string }
          - { name: lienTexte, label: Texte du bouton de ce lien, type: string }
          - { name: exemple, label: Afficher l'étiquette « Exemple », type: boolean }

  - name: recherche
    label: Carnet de recherche
    type: file
    path: content/recherche.json
    format: json
    fields:
      - { name: titre, label: "Titre de la page (un seul mot *entre astérisques* = Times italique)", type: string }
      - { name: chapeau, label: Présentation courte, type: text }
      - { name: presentation, label: Mention sous la présentation, type: text }
      - { name: email, label: Adresse e-mail du pôle recherche, type: string }
      - { name: nomCarnet, label: Nom du carnet (utilisé dans la référence à citer), type: string }
      - name: articles
        label: Articles
        type: object
        list: { collapsible: { collapsed: true, summary: "{date} · {titre}" } }
        fields:
          - { name: titre, label: Titre, type: string, required: true }
          - { name: date, label: Date de publication, type: date, required: true }
          - { name: auteurs, label: Auteur(s), type: string }
          - name: rubrique
            label: Rubrique
            type: select
            options:
              values: [Droit constitutionnel, Libertés fondamentales, Droit administratif, Droit comparé, Contentieux, Droit électoral, Méthode, Note de lecture, Actualité]
          - { name: chapeau, label: Chapeau (résumé de deux ou trois phrases), type: text }
          - { name: corps, label: "Texte de l'article (intertitres, listes, citations ; écrire [1], [2]… pour appeler les notes)", type: rich-text }
          - { name: notes, label: "Notes de bas de page (la 1re correspond à [1], etc.)", type: text, list: true }
          - { name: image, label: Image d'illustration (facultative), type: image }
          - { name: imageAlt, label: Description de l'image (pour les malvoyants), type: string }
          - { name: slug, label: "Adresse de l'article (facultatif : créée à partir du titre)", type: string }
          - { name: exemple, label: Afficher l'étiquette « Exemple », type: boolean }
