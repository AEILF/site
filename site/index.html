<script>
  // Ancienne adresse aeilf.github.io/site/… : renvoi vers la même page à la racine du site

    var p = location.pathname.replace(/^\/site(\/|$)/, "/");
    location.replace(p + location.search + location.hash);
  })();
</script>

</head>
<body><p>Le site a déménagé : <a href="/">aeilf.github.io</a>.</p></body>
