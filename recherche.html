<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet de recherche</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=recherche/">
<link rel="canonical" href="recherche/">
<script>
  // Ancienne adresse : renvoi vers la nouvelle (recherche/); « recherche.html#article » devient « recherche/article/ »
  location.replace("recherche/" + (location.hash.length > 1 && !/^#(r-index|contenu)$/.test(location.hash) ? encodeURIComponent(decodeURIComponent(location.hash.slice(1))) + "/" : ""));
</script>
</head>
<body><p>Cette page a déménagé : <a href="recherche/">recherche/</a>.</p></body>
</html>
